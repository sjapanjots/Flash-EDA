name: Publish to PyPI

# Runs when a GitHub Release is published (e.g. tag v0.3.0), or manually
# from the Actions tab ("Run workflow") to publish the version on main.
# Uses PyPI trusted publishing: no API token is stored in the repo.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check versions match
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SETUP=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read())[1])")
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('flasheda/__init__.py').read())[1])")
          echo "setup.py: $SETUP  flasheda.__version__: $PKG  release tag: ${TAG:-none}"
          [ "$SETUP" = "$PKG" ] || { echo "setup.py and __version__ differ"; exit 1; }
          if [ -n "$TAG" ] && [ "$TAG" != "v$SETUP" ]; then echo "Tag $TAG != v$SETUP"; exit 1; fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
